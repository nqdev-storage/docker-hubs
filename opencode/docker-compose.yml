# OpenCode Docker Compose Configuration
# -----------------------------------------
# A self-hosted, open-source, and privacy-focused router for your applications.
# GitHub: https://github.com/anomalyco/opencode
# Documentation: https://opencode.ai/docs/#windows
# OpenCode v1 -> https://opencode.ai/docs
# OpenCode v2 -> https://opencode.ai/v2/docs
# - Server: https://opencode.ai/docs/server/
# - Zen: https://opencode.ai/docs/zen/
# - CLI Env: https://opencode.io.vn/docs/cli/
# -----------------------------------------
# START: docker-compose up -d --build --force-recreate --remove-orphans
# STOP: docker-compose down -v --remove-orphans
# EXEC: docker exec -it opencode-10026 script -q -c "bash"
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

services:
  opencode:
    #image: ghcr.io/anomalyco/opencode:latest
    #image: ghcr.io/nqdev-storage/opencode:1.17.18-rc7-manual
    #image: ghcr.io/nqdev-storage/opencode:1.18.31-rc9-manual
    image: ghcr.io/nqdev-storage/opencode:2.0.18-rc11-manual
    #image: quyit/opencode:1.17.9
    #build:
    #  context: .  # Th╞░ mß╗Ñc chß╗⌐a Dockerfile
    #  dockerfile: Dockerfile  # T├¬n cß╗ºa Dockerfile, nß║┐u kh├íc t├¬n mß║╖c ─æß╗ïnh 'Dockerfile'
    container_name: opencode-10029
    restart: unless-stopped
    user: root  # Th├¬m d├▓ng n├áy ─æß╗â chß║íy container vß╗¢i quyß╗ün root
    privileged: true # Cß║Ñp quyß╗ün quß║ún trß╗ï ─æß║╖c biß╗çt ─æß╗â can thiß╗çp hß╗ç thß╗æng mß║íng (MITM cß║ºn)
    # network_mode: host
    ports:
      - "10029:4096"    # ├ính xß║í port ─æß╗â truy cß║¡p tß╗½ ngo├ái
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME:-opencode}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-password}
      # Mß╗Öt sß╗æ plugin/CLI cß╗ºa WakaTime hß╗ù trß╗ú ─æß╗ìc trß╗▒c tiß║┐p tß╗½ ENV
      - WAKATIME_API_KEY=${WAKATIME_API_KEY:-ak-api-key}
    env_file:
      - .env
    # command: web --hostname 0.0.0.0 --port 4096 # ΓåÆ v1
    command: serve --hostname 0.0.0.0 --port 4096 # ΓåÆ v2
    volumes:
      # Mount file config (chß╗ìn :ro ─æß╗â bß║úo mß║¡t)
      # - ~/.wakatime.cfg:/root/.wakatime.cfg:ro
      - ./data/oc-local:/root/.local/share/opencode/
      - ./data/oc-config:/root/.config/opencode/
      - ./data/oc-cache:/root/.cache/opencode       # (LSP server tß║úi vß╗ü, v.v. ΓÇö mß║Ñt th├¼ lß║ºn chß║íy sau tß║úi lß║íi)
      - ./data/oc-state:/root/.local/state/opencode
      - ./data/wps:/app/data   # l╞░u dß╗» liß╗çu persistent
    #depends_on:
    #  - n8n_db
    #  - n8n_redis
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway" # ─Éß╗â kß║┐t nß╗æi ─æß║┐n localhost cß╗ºa host tß╗½ container
      - "minipc-quyit:192.168.1.200"
    ulimits:
      nproc: 65536 # Giß╗¢i hß║ín sß╗æ l╞░ß╗úng tiß║┐n tr├¼nh con m├á container c├│ thß╗â tß║ío ra
      nofile: # Giß╗¢i hß║ín sß╗æ l╞░ß╗úng file m├á container c├│ thß╗â mß╗ƒ c├╣ng l├║c
        soft: 102400
        hard: 102400
    deploy:
      resources:
        limits:
          cpus: "1" # Giß╗¢i hß║ín 80% CPU
          memory: "4G" # Giß╗¢i hß║ín 3.2GB RAM (80% cß╗ºa 4GB)
        reservations:
          memory: "256M" # ─Éß║úm bß║úo container c├│ ├¡t nhß║Ñt 256MB RAM

