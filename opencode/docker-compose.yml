# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
# OpenCode Docker Compose Configuration
# -----------------------------------------
# A self-hosted, open-source, and privacy-focused router for your applications.
# GitHub: https://github.com/anomalyco/opencode
# Documentation: https://opencode.ai/docs/#windows
# - Server: https://opencode.ai/docs/server/
# - Zen: https://opencode.ai/docs/zen/
# -----------------------------------------
# START: docker-compose up -d --build --force-recreate --remove-orphans
# STOP: docker-compose down -v --remove-orphans
# EXEC: docker exec -it opencode-10029 script -q -c "bash"
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

services:
  opencode:
    #image: ghcr.io/anomalyco/opencode:latest
    #image: ghcr.io/nqdev-storage/opencode:1.17.18-rc7-manual
    #image: ghcr.io/nqdev-storage/opencode:1.18.31-rc9-manual
    image: ghcr.io/nqdev-storage/opencode:2.0.18-rc11-manual
    #image: quyit/opencode:1.17.9
    #build:
    #  context: .  # Thư mục chứa Dockerfile
    #  dockerfile: Dockerfile  # Tên của Dockerfile, nếu khác tên mặc định 'Dockerfile'
    container_name: opencode-10029
    restart: unless-stopped
    user: root  # Thêm dòng này để chạy container với quyền root
    privileged: true # Cấp quyền quản trị đặc biệt để can thiệp hệ thống mạng (MITM cần)
    # network_mode: host
    ports:
      - "10029:4096"    # ánh xạ port để truy cập từ ngoài
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME:-opencode}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-password}
      # Một số plugin/CLI của WakaTime hỗ trợ đọc trực tiếp từ ENV
      - WAKATIME_API_KEY=${WAKATIME_API_KEY:-ak-api-key}
    env_file:
      - .env
    # command: web --hostname 0.0.0.0 --port 4096 # → v1
    command: serve --hostname 0.0.0.0 --port 4096 # → v2
    volumes:
      # Mount file config (chọn :ro để bảo mật)
      # - ~/.wakatime.cfg:/root/.wakatime.cfg:ro
      - ./data/oc-local:/root/.local/share/opencode/
      - ./data/oc-config:/root/.config/opencode/
      - ./data/oc-cache:/root/.cache/opencode       # (LSP server tải về, v.v. — mất thì lần chạy sau tải lại)
      - ./data/oc-state:/root/.local/state/opencode
    #depends_on:
    #  - n8n_db
    #  - n8n_redis
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway" # Để kết nối đến localhost của host từ container
      - "minipc-quyit:192.168.1.200"
    ulimits:
      nproc: 65536 # Giới hạn số lượng tiến trình con mà container có thể tạo ra
      nofile: # Giới hạn số lượng file mà container có thể mở cùng lúc
        soft: 102400
        hard: 102400
    deploy:
      resources:
        limits:
          cpus: "4" # Giới hạn 80% CPU
          memory: "8G" # Giới hạn 3.2GB RAM (80% của 4GB)
        reservations:
          memory: "256M" # Đảm bảo container có ít nhất 256MB RAM
