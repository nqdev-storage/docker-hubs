# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
# Docker Compose - Playwright MCP Server (OPTIMIZED)
# -----------------------------------------
# START:  docker-compose -f docker-compose.yml up -d --build
# STOP:   docker-compose -f docker-compose.yml down -v
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

version: '3.8'

services:
  playwright-mcp:
    # Use optimized Dockerfile
    build:
      context: .
      dockerfile: Dockerfile  # or Dockerfile.ultra-slim
      args:
        BUILDKIT_INLINE_CACHE: 1  # Enable inline cache for faster builds
    
    container_name: playwright-mcp-40001
    
    # Restart policy
    restart: unless-stopped
    
    # Port mapping
    ports:
      - "40001:8931"
    
    # Optimized environment
    environment:
      TZ: Asia/Ho_Chi_Minh
      NODE_ENV: production
      NPM_CONFIG_LOGLEVEL: error
      # Reduce npm overhead
      npm_config_prefer_offline: "true"
      npm_config_prefer_frozen_lockfile: "true"
    
    # DNS (simplified)
    dns:
      - 1.1.1.1  # Cloudflare
      - 8.8.8.8  # Google
    
    # Extra hosts
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "minipc-quyit:192.168.1.200"
    
    # Reduced shared memory (Chromium only)
    shm_size: 1gb
    
    # Optimized resource limits
    deploy:
      resources:
        limits:
          cpus: "1"        # Can use full CPU when needed
          memory: "1.5G"   # Reduced from 2G
        reservations:
          cpus: "0.25"     # Reserve 25% CPU (was 50%)
          memory: "256M"   # Reserve 256MB (unchanged)
    
    # Optimized logging
    logging:
      driver: "json-file"
      options:
        max-size: "5m"     # Reduced from 10m
        max-file: "2"      # Reduced from 3
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8931/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# Network configuration
networks:
  default:
    name: playwright-network
    driver: bridge
