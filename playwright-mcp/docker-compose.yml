# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
# Docker Compose - Playwright MCP Server (OPTIMIZED)
# -----------------------------------------
# Introduction - https://playwright.dev/mcp/introduction
# Playwright MCP: https://playwright.dev/docs/getting-started-mcp
# Playwright Docker Images: https://playwright.dev/docs/docker
# Github: https://github.com/nqdev-storage/docker-hubs/tree/main/playwright-mcp
# -----------------------------------------
# START: docker-compose up -d --build --force-recreate --remove-orphans
# STOP: docker-compose down -v
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

services:
  playwright-mcp:
    # Use optimized Dockerfile
    build:
      context: .
      dockerfile: Dockerfile  # or Dockerfile.ultra-slim
      args:
        BUILDKIT_INLINE_CACHE: 1  # Enable inline cache for faster builds
    
    container_name: playwright-mcp-40001
    
    # Restart policy
    restart: unless-stopped
    
    # Port mapping
    ports:
      - "40001:8931"
    
    # Optimized environment
    environment:
      TZ: Asia/Ho_Chi_Minh
      NODE_ENV: production
      NPM_CONFIG_LOGLEVEL: error
      # Reduce npm overhead
      npm_config_prefer_offline: "true"
      npm_config_prefer_frozen_lockfile: "true"

    #env_file:
    #  - .env

    # Command to run Playwright MCP with Chrome and dependencies
    command: >
      sh -c "npx playwright install --with-deps chrome && exec npx @playwright/mcp --host 0.0.0.0 --port 8931 --allowed-hosts=* --headless --caps=network,storage,testing,vision,devtools"
    #command:
    #  [
    #    "npx",
    #    "@playwright/mcp",
    #    "--host",
    #    "0.0.0.0",
    #    "--port",
    #    "8931",
    #    "--allowed-hosts=*",
    #    #"--allowed-hosts=your-domain.com,192.168.1.10"
    #    "--headless",
    #    #"--browser=chrome",
    #    #"--browser=chromium",
    #    "--caps=network,storage,testing,vision,devtools"
    #  ]
    
    # DNS (simplified)
    dns:
      - 1.1.1.1  # Cloudflare
      - 8.8.8.8  # Google
    
    # Extra hosts
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "minipc-quyit:192.168.1.200"
    
    # Reduced shared memory (Chromium only)
    shm_size: 1gb
    
    # Optimized resource limits
    deploy:
      resources:
        limits:
          cpus: "1"        # Can use full CPU when needed
          memory: "1.5G"   # Reduced from 2G
        reservations:
          cpus: "0.25"     # Reserve 25% CPU (was 50%)
          memory: "256M"   # Reserve 256MB (unchanged)
    
    # Optimized logging
    logging:
      driver: "json-file"
      options:
        max-size: "5m"     # Reduced from 10m
        max-file: "2"      # Reduced from 3
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8931/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# Network configuration
networks:
  default:
    name: playwright-network
    driver: bridge
